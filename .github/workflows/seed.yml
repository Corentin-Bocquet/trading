name: seed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier si le depot est deja rempli
        id: check
        run: |
          if [ -f index.html ]; then echo "done=true" >> $GITHUB_OUTPUT; else echo "done=false" >> $GITHUB_OUTPUT; fi

      - name: Telecharger et extraire l'application
        if: steps.check.outputs.done == 'false'
        run: |
          curl -sSL -o app.zip "https://nrhkijgxbxslczutjrev.supabase.co/storage/v1/object/public/seed/trading-app.zip"
          unzip -q app.zip
          cp -a trading/. ./
          rm -rf trading app.zip
          ls -la

      - name: Publier les fichiers
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Application Trading : pages, sons, icones, donnees [skip ci]"
          git push
