name: rappel quotidien

on:
  schedule:
    - cron: '0 17 * * *'   # 19 h a Paris en ete, 18 h en hiver
  workflow_dispatch:

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install web-push --no-save
      - run: node tools/rappel.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
