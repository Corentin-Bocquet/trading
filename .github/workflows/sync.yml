name: sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer la nouvelle version
        run: |
          curl -sSL -o /tmp/app.zip "https://nrhkijgxbxslczutjrev.supabase.co/storage/v1/object/public/seed/trading-v3.zip"
          unzip -o -q /tmp/app.zip -d /tmp/new
          # le depot doit refleter exactement l'archive : on repart d'une page blanche
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/new/trading/. ./
          ls -la

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "rien a publier"; exit 0; fi
          git commit -m "Profil editable (pseudo + photo), precision au classement, perf en pourcentage [skip ci]"
          git push
