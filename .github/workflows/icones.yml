name: icones

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  master1024:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deriver le master 1024 depuis le 512
        run: |
          set -e
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/icons/icon-512.png').convert('RGB')
          im.resize((1024, 1024), Image.LANCZOS).quantize(colors=10).save(
              'assets/icons/icon-1024.png', optimize=True)
          PY
          file assets/icons/icon-1024.png

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/icon-1024.png
          git commit -m "Master 1024 de la nouvelle icone [skip ci]"
          git push
